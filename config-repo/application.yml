spring:
  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 1000
        max-interval: 2000
        max-attempts: 6

logging:
  level:
    root: INFO
    com.cargotracking: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  error:
    include-message: always

security:
  oauth2:
    resourceserver:
      jwt:
        issuer-uri: ${JWT_ISSUER_URI:http://user-management-service:8081}

# For JWT generation and validation
jwt:
  secret: MySecretKeyForJWTSigningMustBeAtLeast256BitsLongForSecurityReasons123456789
