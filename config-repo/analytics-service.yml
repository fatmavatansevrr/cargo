spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/analytics_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  data:
    mongodb:
      uri: mongodb://mongodb:27017/analytics_db
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  instance:
    prefer-ip-address: true
