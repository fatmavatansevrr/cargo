# User Management Service Configuration
server:
  port: 8081

# Database Configuration
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/cargotracking
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
    
  # HikariCP Configuration  
  hikari:
    connection-timeout: 60000
    maximum-pool-size: 5
    minimum-idle: 1
    idle-timeout: 300000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

# JWT Configuration
jwt:
  secret: MySuperSecretKey
  expiration: 86400
