server:
  port: 8083
spring:
  application:
    name: tracking-service
  cloud:
    config:
      enabled: false

data:
  mongodb:
    uri: ${MONGODB_URL:mongodb://localhost:27017/tracking_db}


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
