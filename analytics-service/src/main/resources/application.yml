spring:
  application:
    name: analytics-service
    
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://mongodb:27017/analytics_db} # Docker için servis adını kullan
    redis:
      host: ${REDIS_HOST:redis} # Docker için servis adını kullan
      port: ${REDIS_PORT:6379}

  cloud:
    config:
      enabled: true
      uri: ${CONFIG_SERVER_URL:http://config-server:8888}
      fail-fast: true
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    consumer:
      group-id: analytics-group

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.cargotracking: DEBUG
    root: INFO

server:
  port: 8085
