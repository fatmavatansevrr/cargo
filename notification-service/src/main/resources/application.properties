spring.application.name=notification-service

# Spring Cloud Compatibility Check - Disabled to avoid false compatibility warnings
# Spring Boot 3.5.0 is actually compatible with Spring Cloud 2025.0.0
spring.cloud.compatibility-verifier.enabled=false

# Config Server Settings
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Kafka Configuration
# Docker üzerinde çalışırken kafka hostname'i kullanılır
# Lokal çalıştırırken localhost kullanılır
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# MongoDB Configuration
# Docker üzerinde çalışırken mongodb hostname'i kullanılır
# Lokal çalıştırırken localhost kullanılır
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=notification_db
# MongoDB authentication olmadan çalışacak şekilde ayarlandı
# spring.data.mongodb.username=${MONGODB_USERNAME:}
# spring.data.mongodb.password=${MONGODB_PASSWORD:}

# Email Configuration - Gmail SMTP
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${EMAIL_USERNAME:cargotracking.test@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.debug=false
spring.mail.from=${EMAIL_FROM:cargotracking.test@gmail.com}

# Email Provider Settings
email.provider.enabled=true
email.provider.type=gmail
email.retry.max-attempts=3
email.retry.delay=5000

# SMS Configuration - Twilio
sms.provider.enabled=true
sms.provider.type=twilio
twilio.account.sid=${TWILIO_ACCOUNT_SID:your-account-sid}
twilio.auth.token=${TWILIO_AUTH_TOKEN:your-auth-token}
twilio.phone.number=${TWILIO_PHONE_NUMBER:+1234567890}
sms.retry.max-attempts=3
sms.retry.delay=3000

# Template Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Server Configuration
server.port=8084

# Eureka Client Configuration
# Docker üzerinde çalışırken eureka-server hostname'i kullanılır
# Lokal çalıştırırken localhost kullanılır
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.preferIpAddress=true

# Logging Configuration
logging.level.com.cargotracking.notification_service=DEBUG
logging.level.org.springframework.kafka=INFO
