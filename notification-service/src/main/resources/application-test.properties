# Test Configuration
spring.application.name=notification-service-test
server.port=8085

# Disable external dependencies for testing
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
eureka.client.enabled=false

# Embedded MongoDB (will be auto-configured)
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=notification_test_db

# Disable Kafka for simple testing
spring.kafka.bootstrap-servers=localhost:9092
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Email Configuration (Mock)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test
spring.mail.from=test@example.com

# Logging
logging.level.com.cargotracking.notification_service=DEBUG
logging.level.org.springframework.kafka=WARN 