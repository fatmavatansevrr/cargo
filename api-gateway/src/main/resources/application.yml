spring:
  application:
    name: api-gateway

  config:
    import: "configserver:${CONFIG_SERVER_URL:http://config-server:8888}"

  cloud:
    config:
      enabled: true
      uri: ${CONFIG_SERVER_URL:http://config-server:8888}
      fail-fast: true
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka/}
  instance:
    preferIpAddress: true
    instanceId: ${spring.application.name}:${server.port}

jwt:
  secret: MySecretKeyForJWTSigningMustBeAtLeast256BitsLongForSecurityReasons123456789

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.cargotracking: DEBUG
