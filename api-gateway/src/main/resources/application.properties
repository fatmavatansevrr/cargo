spring.application.name=api-gateway

# Config Server Settings
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Server Configuration
server.port=8080

# Gateway Routes Configuration
# Docker üzerinde çalışırken service hostname'leri kullanılır
# Lokal çalıştırırken localhost kullanılır
spring.cloud.gateway.routes[0].id=user-management-auth
spring.cloud.gateway.routes[0].uri=${USER_MANAGEMENT_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=user-management-admin
spring.cloud.gateway.routes[1].uri=${USER_MANAGEMENT_URL:http://localhost:8081}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/admin/**

spring.cloud.gateway.routes[2].id=shipment-service
spring.cloud.gateway.routes[2].uri=${SHIPMENT_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/shipments/**

spring.cloud.gateway.routes[3].id=tracking-service
spring.cloud.gateway.routes[3].uri=${TRACKING_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/tracking/**

spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/notifications/**

spring.cloud.gateway.routes[5].id=analytics-service
spring.cloud.gateway.routes[5].uri=${ANALYTICS_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/analytics/**

# Eureka Client Configuration
# Docker üzerinde çalışırken eureka-server hostname'i kullanılır
# Lokal çalıştırırken localhost kullanılır
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.preferIpAddress=true

# JWT Configuration for Authentication
jwt.secret=MySecretKeyForJWTSigningMustBeAtLeast256BitsLongForSecurityReasons123456789
jwt.expiration=86400

# Rate Limiting Configuration (FR-GW-003) - Şimdilik devre dışı
# spring.cloud.gateway.routes[0].filters[0]=RequestRateLimiter=10,20

# CORS Configuration
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*

# SpringDoc OpenAPI Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Spring Boot Actuator Configuration (NFR-OBSV-003)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.com.cargotracking=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
