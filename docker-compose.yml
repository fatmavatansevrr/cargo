# Network tanımı - tüm servislerin birbirleri ile iletişim kurabilmesi için
networks:
  cargo-tracking-network:
    driver: bridge

services:

  # PostgreSQL - Ana veritabanı sunucusu
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - cargo-tracking-network

  # MongoDB - NoSQL veritabanı
  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - cargo-tracking-network

  # Redis - Cache ve Session Store
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cargo-tracking-network

  # Kafka ve Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - cargo-tracking-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - "9092:9092"
    networks:
      - cargo-tracking-network

  # Config Server
  config-server:
    build: ./config-server
    ports:
      - "8888:8888"
    depends_on:
      - kafka
      - postgres
    volumes:
      - ./config-repo:/app/config-repo:ro  # read-only olarak mount edin
    networks:
      - cargo-tracking-network
    environment:
      #  Disable Eureka client for config server
      - EUREKA_CLIENT_ENABLED=false
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s



  #  Eureka Server - Should start after config-server is healthy
  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker  # ✅ Docker profili aktif et
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - cargo-tracking-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # API Gateway
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - config-server
      - eureka-server
    networks:
      - cargo-tracking-network
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - USER_MANAGEMENT_URL=http://user-management-service:8081
      - SHIPMENT_SERVICE_URL=http://shipment-service:8082
      - TRACKING_SERVICE_URL=http://tracking-service:8083
      - NOTIFICATION_SERVICE_URL=http://notification-service:8084
      - ANALYTICS_SERVICE_URL=http://analytics-service:8085
      - SPRING_PROFILES_ACTIVE=docker

  # Microservices
  user-management-service:
    build: ./user-management-service
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - cargo-tracking-network
    ports:
      - "8081:8081"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/user_management_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=1234
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888  # ✅ Bu satır eksikti
      - SPRING_PROFILES_ACTIVE=docker
    restart: on-failure

  shipment-service:
    build: ./shipment-service
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - cargo-tracking-network
    ports:
      - "8082:8082"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/shipment_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=1234
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_PROFILES_ACTIVE=docker
      - DDL_AUTO=update
      - SHOW_SQL=true

    volumes:
      - ./logs:/app/logs  # Log dosyaları için
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: on-failure:3

  tracking-service:
    build: ./tracking-service
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - cargo-tracking-network
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/tracking_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    ports:
      - "8083:8083"

  notification-service:
    build: ./notification-service
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_started
      mongodb:
        condition: service_healthy
    networks:
      - cargo-tracking-network
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888        # Eklenmeli
      - EUREKA_URL=http://eureka-server:8761/eureka/       # Eureka bağlantısı
      - MONGODB_URL=mongodb://mongodb:27017/notification_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MAIL_HOST=smtp.gmail.com                           # Mail desteği varsa dışarıdan ayarlanabilir
      - MAIL_PORT=587
      - MAIL_USERNAME=cargotracking.test@gmail.com         # Gerçek değer .env ile geçilmeli
      - MAIL_PASSWORD=your-app-password
      - NOTIFICATION_FROM_EMAIL=noreply@cargotracking.com
      - NOTIFICATION_FROM_NAME=Cargo Tracking System
    restart: on-failure                                     #  Servis hata alırsa yeniden başlat
    healthcheck: # ✅ Sağlık kontrolü ile bağlı servisler beklenir
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    ports:
      - "8084:8084"

  analytics-service:
    build: ./analytics-service
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - cargo-tracking-network
    environment:

      - MONGODB_URL=mongodb://mongodb:27017/analytics_db
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
      - DDL_AUTO=update
      - SHOW_SQL=true
      - LOG_PATH=/app/logs
    ports:
      - "8085:8085"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s  # Başlangıç süresini artırdık
    restart: on-failure:3

# Named volumes
volumes:
  postgres_data:
  mongodb_data:
  redis_data:
