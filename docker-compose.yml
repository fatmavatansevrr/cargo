version: '3.8'

# Network tanımı - tüm servislerin birbirleri ile iletişim kurabilmesi için
networks:
  cargo-tracking-network:
    driver: bridge

services:

  # PostgreSQL
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cargotracking
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cargotracking"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - cargo-tracking-network

  # MongoDB
  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Redis
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # Kafka ve Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  # Config Server
  config-server:
    build: ./config-server
    ports:
      - "8888:8888"
    depends_on:
      - kafka
      - postgres

  # Eureka Server
  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"
    depends_on:
      - config-server

  # API Gateway
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - config-server
      - eureka-server
    networks:
      - cargo-tracking-network
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - USER_MANAGEMENT_URL=http://user-management-service:8081
      - SHIPMENT_SERVICE_URL=http://shipment-service:8082
      - TRACKING_SERVICE_URL=http://tracking-service:8083
      - NOTIFICATION_SERVICE_URL=http://notification-service:8084
      - ANALYTICS_SERVICE_URL=http://analytics-service:8085

  # Microservices
  user-management-service:
    build: ./user-management-service
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - cargo-tracking-network
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/cargotracking
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - EUREKA_URL=http://eureka-server:8761/eureka/

  shipment-service:
    build: ./shipment-service
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - cargo-tracking-network
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/cargotracking
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - EUREKA_URL=http://eureka-server:8761/eureka/

  tracking-service:
    build: ./tracking-service
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - cargo-tracking-network
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/cargotracking
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EUREKA_URL=http://eureka-server:8761/eureka/

  notification-service:
    build: ./notification-service
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - cargo-tracking-network
    environment:
      - KAFKA_SERVERS=kafka:9092
      - EUREKA_URL=http://eureka-server:8761/eureka/

  analytics-service:
    build: ./analytics-service
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - cargo-tracking-network
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/cargotracking
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - MONGODB_URL=mongodb://mongodb:27017/cargotracking
      - EUREKA_URL=http://eureka-server:8761/eureka/

# Named volumes
volumes:
  postgres_data:
