spring.application.name=user-management-service

# Config Server Settings
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Database Configuration - User Management Database
# Docker üzerinde çalışırken postgres hostname'i kullanılır
# Lokal çalıştırırken localhost kullanılır
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/user_management_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Configuration  
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=8081

# Eureka Client Configuration
# Docker üzerinde çalışırken eureka-server hostname'i kullanılır
# Lokal çalıştırırken localhost kullanılır
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.preferIpAddress=true

# JWT Configuration
# JWT secret key - minimum 256 bits (32 characters) required for HMAC-SHA algorithms
jwt.secret=MySecretKeyForJWTSigningMustBeAtLeast256BitsLongForSecurityReasons123456789
jwt.expiration=86400

# SpringDoc OpenAPI Configuration
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# Logging Configuration
logging.level.com.cargotracking=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springdoc=DEBUG
