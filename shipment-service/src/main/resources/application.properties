spring.application.name=shipment-service

# Config Server Settings
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Database Configuration - Shipment Service Database
# Docker üzerinde çalışırken postgres hostname'i kullanılır
# Lokal çalıştırırken localhost kullanılır
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/shipment_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Configuration  
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8082

# Eureka Client Configuration
# Docker üzerinde çalışırken eureka-server hostname'i kullanılır
# Lokal çalıştırırken localhost kullanılır
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.preferIpAddress=true

# Kafka Configuration (FR-SM-008)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Kafka Consumer Configuration (eğer gelecekte consumer eklenirse)
spring.kafka.consumer.group-id=shipment-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# OpenAPI Info
springdoc.info.title=Shipment Service API
springdoc.info.description=Kargo gönderi yönetimi servisi - Requirements FR-SM-001 to FR-SM-008
springdoc.info.version=1.0.0
springdoc.info.contact.name=Cargo Tracking Team
springdoc.info.contact.email=support@cargotracking.com

# Security Configuration
# JWT Secret Key (User Management Service ile aynı olmalı)
jwt.secret=${JWT_SECRET:MySecretKeyForJWTSigningMustBeAtLeast256BitsLongForSecurityReasons123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Actuator Configuration (NFR-OBSV)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Application Info
info.app.name=Shipment Service
info.app.description=Kargo gönderi yönetimi servisi
info.app.version=1.0.0
info.app.requirements=FR-SM-001,FR-SM-002,FR-SM-003,FR-SM-004,FR-SM-005,FR-SM-006,FR-SM-007,FR-SM-008

# Logging Configuration
logging.level.com.cargotracking.shipment_service=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Pagination Configuration
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
