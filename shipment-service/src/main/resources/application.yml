spring:
  application:
    name: shipment-service

  config:
    import: "configserver:${CONFIG_SERVER_URL:http://config-server:8888}"
  cloud:
    config:
      enabled: true
      uri: ${CONFIG_SERVER_URL:http://config-server:8888}
      fail-fast: true
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: 8082